name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          zip -r "capricorn-${{ github.ref_name }}.zip" . -x "*.git*" "capri.log" "electron_crash.log" "visual/node_modules/*" "*.pyc" "*__pycache__*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Capricorn ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: "capricorn-${{ github.ref_name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
